[project]
authors = [
  {name = "m09", email = "142691+m09@users.noreply.github.com"},
]
dependencies = []
description = "Colab lab notebooks referenced from shuuchuu/slides training decks."
homepage = "https://github.com/shuuchuu/labs"
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "labs"
readme = "README.md"
requires-python = ">= 3.12"
version = "0.1.0"

[dependency-groups]
dev = [
  "ruff >= 0.11",
  "ty >= 0.0.33",
]

[tool.ruff]
indent-width = 2
target-version = "py312"

[tool.ruff.lint]
ignore = [
  # undocumented-*
  "D1",
  # D203
  "incorrect-blank-line-before-class",
  # D213
  "multi-line-summary-second-line",
  # E111
  "indentation-with-invalid-multiple",
  # E114
  "indentation-with-invalid-multiple-comment",
  # F811
  "redefined-while-unused",
  # N803
  "invalid-argument-name",
  # N806
  "non-lowercase-variable-in-function",
  # N816
  "mixed-case-variable-in-global-scope",
  # RUF067
  "non-empty-init-module",
]
preview = true
select = ["A", "B", "C", "D", "DOC", "E", "EM", "F", "I", "N", "PIE", "PTH", "RET", "RUF", "SIM", "SLF", "TC", "UP", "W"]

[tool.ruff.lint.per-file-ignores]

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.11,<0.12.0"]
